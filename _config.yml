title: SAI
url: https://steveimm.id
email:
description: >- # this means to ignore newlines until "baseurl:"
  Personal website of Steve Andreas Immanuel. It contains my portfolio, blogs, projects, etc.
github_username: SteveImmanuel
minimal_mistakes_skin: default
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
# timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - temp/
  - .vscode/
  - scripts/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Steve Andreas Immanuel"
  # avatar : "/assets/images/bio-photo.jpg"
  bio    : ""
  links:
    - label: "Email"
      icon: "fa fa-fw fa-envelope"
      url: "mailto:iam.steve.immanuel@gmail.com"
    - label: "Phone"
      icon: "fa fa-fw fa-phone fa-flip-horizontal"
      url: "tel:+821099851378"
    - label: "Google Scholar"
      icon: "fab fa-fw fa-google-scholar"
      url: "https://scholar.google.com/citations?user=7NpZLiYAAAAJ&hl=en"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/SteveImmanuel"
    - label: "GitLab"
      icon: "fab fa-fw fa-gitlab"
      url: "https://gitlab.informatika.org/SteveImmanuel"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/steve-imm"
    - label: "Full Resume (PDF)"
      icon: "fa fa-fw fa-download"
      url: "/assets/pdf/resume_latest.pdf"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/SteveImmanuel"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/steve-imm"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: false
      share: false
      toc: true
      toc_sticky: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _projects
  - scope:
      path: "_projects"
      type: projects
    values:
      layout: single
      author_profile: false
      share: false

collections:
  projects:
    output: false
    permalink: /:collection/:path/
    
# category_archive:
#   type: liquid
#   path: /categories/

tag_archive:
  type: liquid
  path: /tags/

atom_feed:
  hide: true

masthead_title: "Home"

title_separator: "|"

repository: "SteveImmanuel/SteveImmanuel.github.io"

naver_site_verification: "e1e3f3dc91fc4febc2cc4fbdf2d640013abccf8d"
