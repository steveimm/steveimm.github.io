name: Build and Deploy

on:
  push:
    branches:
      - master
      - ci-cd

# permissions:
#   contents: read
#   pages: write
#   id-token: write

jobs:
  build-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        uses: actions/jekyll-build-pages@v1 # see https://github.com/marketplace/actions/build-jekyll-for-github-pages
        with:
          verbose: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # see https://github.com/actions/upload-pages-artifact

  deploy-to-vm:
    runs-on: ubuntu-latest
    needs: build-pages

    steps:
      - name: Download build results
        uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: Check build results
        run: ls -l

      - name: Create SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" > key.pem
          chmod 400 key.pem

      - name: Upload artifact to VM
        run: scp -o "StrictHostKeyChecking=no" -i key.pem artifact.tar ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}:~/.

      # - name: Copy docker compose configuration
      #   run: scp -o "StrictHostKeyChecking=no" -i key.pem docker-compose.yml ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}:~/trackme

      # - name: Stop running containers
      #   run: ssh -o "StrictHostKeyChecking=no" -i key.pem ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "cd trackme && docker-compose -p trackme down"

      # - name: Pull latest image
      #   run: ssh -o "StrictHostKeyChecking=no" -i key.pem ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "docker pull steveimm/trackme:latest"

      # - name: Start containers with latest update
      #   run: ssh -o "StrictHostKeyChecking=no" -i key.pem ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "cd trackme && docker-compose -p trackme up -d"

      # - name: Clean up SSH key
      #   run: rm key.pem